name: Analyze Canon EOS Utility 2.14.31.12c

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-eos-utility:
    name: Analyze EOS Utility 2.14.31.12c
    runs-on: macos-26

    env:
      DOWNLOAD_URL: "https://drive.usercontent.google.com/download?id=1fWSpcQ1-StjwzxlQG2eKNTIfC8qJmqh-&export=download&confirm=t&uuid=7fa31e8a-c5b0-4e35-a6fc-13df3fb37131"
      ZIP_NAME: "EU-Installset-M2.14.31.12c.dmg.zip"

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: Show system information
        shell: bash
        run: |
          set -u

          echo "=============================================="
          echo "SYSTEM"
          echo "=============================================="

          uname -a || true
          echo

          echo "Machine architecture:"
          uname -m || true
          echo

          echo "CPU:"
          sysctl -n hw.machine 2>/dev/null || true
          echo

          echo "macOS:"
          sw_vers || true
          echo

          echo "Xcode:"
          xcodebuild -version 2>/dev/null || true
          echo

          echo "Architecture:"
          arch || true

      # ============================================================
      # 2. CREATE WORKSPACE
      # ============================================================

      - name: Create workspace
        shell: bash
        run: |
          set -u

          mkdir -p "$GITHUB_WORKSPACE/work"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/report"
          mkdir -p "$GITHUB_WORKSPACE/payload"
          mkdir -p "$GITHUB_WORKSPACE/datax-analysis"

      # ============================================================
      # 3. DOWNLOAD ZIP
      # ============================================================

      - name: Download EOS Utility archive
        shell: bash
        working-directory: work
        run: |
          set -u

          echo "Downloading:"
          echo "$DOWNLOAD_URL"
          echo

          rm -f "$ZIP_NAME"

          if ! curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output "$ZIP_NAME" \
            "$DOWNLOAD_URL"
          then
            echo "ERROR: Download failed."
            exit 1
          fi

          echo
          echo "Downloaded:"
          ls -lh "$ZIP_NAME"

          echo
          echo "File type:"
          file "$ZIP_NAME" || true

          echo
          echo "SHA256:"
          shasum -a 256 "$ZIP_NAME" \
            | tee "$GITHUB_WORKSPACE/report/archive.sha256"

      # ============================================================
      # 4. VALIDATE ZIP
      # ============================================================

      - name: Validate ZIP archive
        shell: bash
        working-directory: work
        run: |
          set -u

          echo "Testing ZIP..."

          if unzip -t "$ZIP_NAME" \
            > "$GITHUB_WORKSPACE/report/zip-test.txt" 2>&1
          then
            echo "ZIP TEST: OK"
          else
            echo "ZIP TEST: FAILED"
            cat "$GITHUB_WORKSPACE/report/zip-test.txt"
            exit 1
          fi

      # ============================================================
      # 5. EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP
        shell: bash
        working-directory: extracted
        run: |
          set -u

          rm -rf ./*
          rm -rf ./.??* 2>/dev/null || true

          unzip -o \
            "$GITHUB_WORKSPACE/work/$ZIP_NAME"

          echo "=============================================="
          echo "EXTRACTED FILES"
          echo "=============================================="

          find . \
            -print \
            2>/dev/null \
            | sort \
            | tee "$GITHUB_WORKSPACE/report/extracted-files.txt"

      # ============================================================
      # 6. LOCATE DMG
      # ============================================================

      - name: Locate DMG
        id: locate_dmg
        shell: bash
        run: |
          set -u

          DMG=""

          while IFS= read -r FILE; do
            DMG="$FILE"
            break
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -iname '*.dmg' \
              -print \
              2>/dev/null
          )

          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found."
            exit 1
          fi

          echo "DMG=$DMG" >> "$GITHUB_OUTPUT"

          echo "DMG:"
          echo "$DMG"

          echo
          echo "DMG size:"
          ls -lh "$DMG"

          echo
          echo "DMG file type:"
          file "$DMG" || true

          echo
          echo "DMG SHA256:"
          shasum -a 256 "$DMG" \
            | tee "$GITHUB_WORKSPACE/report/dmg.sha256"

      # ============================================================
      # 7. DMG IMAGE INFORMATION
      # ============================================================

      - name: Analyze DMG image
        env:
          DMG: ${{ steps.locate_dmg.outputs.DMG }}
        shell: bash
        run: |
          set -u

          echo "=============================================="
          echo "DMG IMAGE INFO"
          echo "=============================================="

          hdiutil imageinfo "$DMG" \
            > "$GITHUB_WORKSPACE/report/dmg-imageinfo.txt" \
            2>&1 || true

          cat "$GITHUB_WORKSPACE/report/dmg-imageinfo.txt"

      # ============================================================
      # 8. MOUNT DMG
      # ============================================================

      - name: Mount DMG
        id: mount_dmg
        env:
          DMG: ${{ steps.locate_dmg.outputs.DMG }}
        shell: bash
        run: |
          set -u

          MOUNT_POINT="$RUNNER_TEMP/eos-dmg"

          mkdir -p "$MOUNT_POINT"

          echo "Mounting DMG..."

          if ! hdiutil attach \
            "$DMG" \
            -mountpoint "$MOUNT_POINT" \
            -nobrowse \
            -noautoopen
          then
            echo "ERROR: Unable to mount DMG."
            exit 1
          fi

          echo "MOUNT_POINT=$MOUNT_POINT" >> "$GITHUB_OUTPUT"

          echo
          echo "Mounted at:"
          echo "$MOUNT_POINT"

      # ============================================================
      # 9. LIST DMG CONTENTS SAFELY
      # ============================================================

      - name: List DMG contents
        env:
          MOUNT_POINT: ${{ steps.mount_dmg.outputs.MOUNT_POINT }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report/dmg-contents.txt"

          echo "=============================================="
          echo "DMG CONTENTS"
          echo "=============================================="

          find "$MOUNT_POINT" \
            \( \
              -path "$MOUNT_POINT/.Trashes" \
              -o -path "$MOUNT_POINT/.fseventsd" \
              -o -path "$MOUNT_POINT/.TemporaryItems" \
            \) -prune \
            -o \
            -print \
            2>/dev/null \
            | sort \
            | tee "$REPORT"

      # ============================================================
      # 10. LOCATE INSTALLER APP
      # ============================================================

      - name: Locate Canon installer
        id: locate_installer
        env:
          MOUNT_POINT: ${{ steps.mount_dmg.outputs.MOUNT_POINT }}
        shell: bash
        run: |
          set -u

          INSTALLER=""

          while IFS= read -r APP; do
            INSTALLER="$APP"
            break
          done < <(
            find "$MOUNT_POINT" \
              -type d \
              -name '*.app' \
              -print \
              2>/dev/null
          )

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No .app found."
            exit 1
          fi

          echo "INSTALLER=$INSTALLER" >> "$GITHUB_OUTPUT"

          echo "Installer:"
          echo "$INSTALLER"

      # ============================================================
      # 11. ANALYZE INSTALLER INFO.PLIST
      # ============================================================

      - name: Analyze installer metadata
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          echo "=============================================="
          echo "INSTALLER INFO.PLIST"
          echo "=============================================="

          if [ -f "$INSTALLER/Contents/Info.plist" ]; then

            /usr/libexec/PlistBuddy \
              -c "Print" \
              "$INSTALLER/Contents/Info.plist" \
              > "$REPORT/installer-info.plist.txt" \
              2>&1 || true

            cat "$REPORT/installer-info.plist.txt"

          else

            echo "Info.plist not found."

          fi

      # ============================================================
      # 12. ANALYZE OFICORE
      # ============================================================

      - name: Analyze OFICore
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"
          OFICORE="$INSTALLER/Contents/MacOS/OFICore"

          echo "=============================================="
          echo "OFICORE"
          echo "=============================================="

          if [ ! -f "$OFICORE" ]; then
            echo "OFICore not found."
            exit 0
          fi

          echo "File:"
          file "$OFICORE" \
            | tee "$REPORT/oficore-file.txt"

          echo
          echo "Architecture:"
          lipo -info "$OFICORE" \
            2>&1 \
            | tee "$REPORT/oficore-architecture.txt" \
            || true

          echo
          echo "Mach-O header:"
          otool -hv "$OFICORE" \
            2>&1 \
            | tee "$REPORT/oficore-header.txt" \
            || true

          echo
          echo "Linked libraries:"
          otool -L "$OFICORE" \
            2>&1 \
            | tee "$REPORT/oficore-libraries.txt" \
            || true

          echo
          echo "Strings:"
          strings -a "$OFICORE" \
            > "$REPORT/oficore-all-strings.txt" \
            2>/dev/null || true

          grep -Ei \
            'canon|eos|edsdk|camera|utility|installer|package|framework|dylib|pkg' \
            "$REPORT/oficore-all-strings.txt" \
            | sort -u \
            > "$REPORT/oficore-relevant-strings.txt" \
            || true

      # ============================================================
      # 13. ANALYZE DATAX
      # ============================================================

      - name: Analyze Data.datx
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          DATAX="$INSTALLER/Contents/Resources/Data.datx"
          OUT="$GITHUB_WORKSPACE/datax-analysis"

          mkdir -p "$OUT"

          echo "=============================================="
          echo "DATA.DATX"
          echo "=============================================="

          if [ ! -f "$DATAX" ]; then
            echo "Data.datx not found."
            exit 0
          fi

          echo "File:"
          ls -lh "$DATAX"

          echo
          echo "Type:"
          file "$DATAX" \
            | tee "$OUT/file.txt"

          echo
          echo "SHA256:"
          shasum -a 256 "$DATAX" \
            | tee "$OUT/sha256.txt"

          echo
          echo "Header:"
          xxd -l 512 "$DATAX" \
            > "$OUT/header.txt" \
            2>&1 || true

          cat "$OUT/header.txt"

          echo
          echo "Extracting strings..."

          strings -a "$DATAX" \
            > "$OUT/all-strings.txt" \
            2>/dev/null || true

          grep -Ei \
            'canon|eos|edsdk|camera|utility|framework|dylib|pkg|\.app|\.framework|\.bundle|\.plugin' \
            "$OUT/all-strings.txt" \
            | sort -u \
            > "$OUT/relevant-strings.txt" \
            || true

          echo
          echo "Relevant strings:"
          cat "$OUT/relevant-strings.txt" || true

      # ============================================================
      # 14. SEARCH FOR PAYLOAD FILES
      # ============================================================

      - name: Search installer payload
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          echo "=============================================="
          echo "PAYLOAD FILE SEARCH"
          echo "=============================================="

          find "$INSTALLER" \
            -type f \
            \( \
              -iname '*.pkg' \
              -o -iname '*.mpkg' \
              -o -iname '*.dmg' \
              -o -iname '*.zip' \
              -o -iname '*.tar' \
              -o -iname '*.gz' \
              -o -iname '*.bz2' \
              -o -iname '*.xar' \
              -o -iname '*.cab' \
              -o -iname '*.dat' \
              -o -iname '*.datx' \
              -o -iname '*.bin' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | tee "$REPORT/payload-files.txt"

      # ============================================================
      # 15. SEARCH CANON/EOS FILES
      # ============================================================

      - name: Search Canon EOS files
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          find "$INSTALLER" \
            -print \
            2>/dev/null \
            | grep -Ei \
              'canon|eos|edsdk|camera|utility|dylib|framework|bundle|plugin|pkg' \
            | sort \
            > "$REPORT/canon-eos-files.txt" \
            || true

          echo "=============================================="
          echo "CANON / EOS FILES"
          echo "=============================================="

          cat "$REPORT/canon-eos-files.txt" || true

      # ============================================================
      # 16. SEARCH ALL MACH-O
      # ============================================================

      - name: Find all Mach-O binaries
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/all-mach-o.txt"

          while IFS= read -r FILE; do

            TYPE="$(file -b "$FILE" 2>/dev/null || true)"

            case "$TYPE" in
              *"Mach-O"*)
                echo "$FILE" >> "$REPORT/all-mach-o.txt"
                ;;
            esac

          done < <(
            find "$INSTALLER" \
              -type f \
              -print \
              2>/dev/null
          )

          sort -u \
            "$REPORT/all-mach-o.txt" \
            -o "$REPORT/all-mach-o.txt"

          echo "=============================================="
          echo "MACH-O FILES"
          echo "=============================================="

          cat "$REPORT/all-mach-o.txt" || true

      # ============================================================
      # 17. ANALYZE ALL MACH-O ARCHITECTURES
      # ============================================================

      - name: Analyze all Mach-O architectures
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/all-macho-architectures.txt"

          while IFS= read -r FILE; do

            echo "==================================================" \
              >> "$REPORT/all-macho-architectures.txt"

            echo "$FILE" \
              >> "$REPORT/all-macho-architectures.txt"

            echo "--------------------------------------------------" \
              >> "$REPORT/all-macho-architectures.txt"

            file "$FILE" \
              >> "$REPORT/all-macho-architectures.txt" \
              2>&1 || true

            lipo -info "$FILE" \
              >> "$REPORT/all-macho-architectures.txt" \
              2>&1 || true

            otool -hv "$FILE" \
              | head -40 \
              >> "$REPORT/all-macho-architectures.txt" \
              2>&1 || true

          done < "$REPORT/all-mach-o.txt"

          cat "$REPORT/all-macho-architectures.txt"

      # ============================================================
      # 18. ANALYZE LINKED LIBRARIES
      # ============================================================

      - name: Analyze linked libraries
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/linked-libraries.txt"

          while IFS= read -r FILE; do

            echo "==================================================" \
              >> "$REPORT/linked-libraries.txt"

            echo "$FILE" \
              >> "$REPORT/linked-libraries.txt"

            otool -L "$FILE" \
              >> "$REPORT/linked-libraries.txt" \
              2>&1 || true

          done < "$REPORT/all-mach-o.txt"

      # ============================================================
      # 19. SEARCH CANON / EOS / EDSDK STRINGS
      # ============================================================

      - name: Search Canon and EDSDK strings
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/canon-strings.txt"

          while IFS= read -r FILE; do

            echo "==================================================" \
              >> "$REPORT/canon-strings.txt"

            echo "$FILE" \
              >> "$REPORT/canon-strings.txt"

            strings -a "$FILE" \
              2>/dev/null \
              | grep -Ei \
                'canon|eos|edsdk|camera|remote.?shoot|live.?view|cr2|download|capture|shutter' \
              | sort -u \
              >> "$REPORT/canon-strings.txt" \
              || true

          done < "$REPORT/all-mach-o.txt"

      # ============================================================
      # 20. CODE SIGNATURE
      # ============================================================

      - name: Analyze code signatures
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          codesign \
            -dv \
            --verbose=4 \
            "$INSTALLER" \
            > "$REPORT/codesign.txt" \
            2>&1 || true

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$INSTALLER" \
            > "$REPORT/codesign-verify.txt" \
            2>&1 || true

          codesign \
            -d \
            --entitlements :- \
            "$INSTALLER" \
            > "$REPORT/entitlements.plist" \
            2>&1 || true

      # ============================================================
      # 21. INSTALLER PACKAGE SEARCH
      # ============================================================

      - name: Search PKG packages
        env:
          MOUNT_POINT: ${{ steps.mount_dmg.outputs.MOUNT_POINT }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          find "$MOUNT_POINT" \
            -type f \
            \( \
              -name '*.pkg' \
              -o -name '*.mpkg' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            > "$REPORT/install-packages.txt"

          echo "=============================================="
          echo "PKG FILES"
          echo "=============================================="

          cat "$REPORT/install-packages.txt" || true

          : > "$REPORT/pkg-analysis.txt"

          while IFS= read -r PKG; do

            echo "==================================================" \
              >> "$REPORT/pkg-analysis.txt"

            echo "$PKG" \
              >> "$REPORT/pkg-analysis.txt"

            pkgutil \
              --check-signature "$PKG" \
              >> "$REPORT/pkg-analysis.txt" \
              2>&1 || true

          done < "$REPORT/install-packages.txt"

      # ============================================================
      # 22. SEARCH INSTALLER METADATA
      # ============================================================

      - name: Extract important plist values
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          PLIST="$INSTALLER/Contents/Info.plist"
          REPORT="$GITHUB_WORKSPACE/report/plist-important.txt"

          : > "$REPORT"

          if [ -f "$PLIST" ]; then

            for KEY in \
              CFBundleIdentifier \
              CFBundleName \
              CFBundleDisplayName \
              CFBundleShortVersionString \
              CFBundleVersion \
              LSMinimumSystemVersion \
              LSArchitecturePriority
            do

              echo "----- $KEY -----" \
                >> "$REPORT"

              /usr/libexec/PlistBuddy \
                -c "Print :$KEY" \
                "$PLIST" \
                >> "$REPORT" \
                2>&1 || true

              echo \
                >> "$REPORT"

            done

          fi

          cat "$REPORT"

      # ============================================================
      # 23. DETERMINE ARM64 POSSIBILITY
      # ============================================================

      - name: Generate architecture verdict
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"
          OUT="$REPORT/ARCHITECTURE-VERDICT.md"

          {
            echo "# EOS Utility 2.14.31.12c Architecture Analysis"
            echo
            echo "## Runner"
            echo
            echo "- Runner architecture: $(uname -m 2>/dev/null || echo unknown)"
            echo "- macOS: $(sw_vers -productVersion 2>/dev/null || echo unknown)"
            echo
            echo "## Mach-O analysis"
            echo
            echo '```text'
            cat "$REPORT/all-macho-architectures.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "## Interpretation"
            echo
            echo "The important architectures are:"
            echo
            echo "- arm64 = Apple Silicon native"
            echo "- x86_64 = Intel"
            echo "- arm64 x86_64 = Universal"
            echo
            echo "This report intentionally does not modify Canon binaries."
          } > "$OUT"

          cat "$OUT"

      # ============================================================
      # 24. GENERATE FINAL SUMMARY
      # ============================================================

      - name: Generate final summary
        if: always()
        env:
          INSTALLER: ${{ steps.locate_installer.outputs.INSTALLER }}
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"
          SUMMARY="$REPORT/SUMMARY.md"

          {
            echo "# Canon EOS Utility 2.14.31.12c Analysis"
            echo
            echo "## Source"
            echo
            echo "- Archive: $ZIP_NAME"
            echo
            echo "## macOS runner"
            echo
            echo "- Architecture: $(uname -m 2>/dev/null || echo unknown)"
            echo "- macOS: $(sw_vers -productVersion 2>/dev/null || echo unknown)"
            echo
            echo "## DMG"
            echo
            echo '```text'
            cat "$REPORT/dmg.sha256" 2>/dev/null || true
            echo '```'
            echo
            echo "## Installer"
            echo
            echo "\`$INSTALLER\`"
            echo
            echo "## Important files"
            echo
            echo '```text'
            cat "$REPORT/canon-eos-files.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "## Mach-O architectures"
            echo
            echo '```text'
            cat "$REPORT/all-macho-architectures.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "## Linked libraries"
            echo
            echo '```text'
            cat "$REPORT/linked-libraries.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "## Canon / EOS / EDSDK strings"
            echo
            echo '```text'
            cat "$REPORT/canon-strings.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "## Architecture verdict"
            echo
            cat "$REPORT/ARCHITECTURE-VERDICT.md" 2>/dev/null || true
          } > "$SUMMARY"

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 25. DETACH DMG
      # ============================================================

      - name: Detach DMG
        if: always()
        env:
          MOUNT_POINT: ${{ steps.mount_dmg.outputs.MOUNT_POINT }}
        shell: bash
        run: |
          set +e

          if [ -n "${MOUNT_POINT:-}" ]; then

            if mount | grep -F "$MOUNT_POINT" >/dev/null 2>&1; then
              hdiutil detach \
                "$MOUNT_POINT" \
                -force \
                2>&1 || true
            fi

          fi

      # ============================================================
      # 26. UPLOAD REPORT
      # ============================================================

      - name: Upload complete analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EOS-Utility-2.14.31.12c-analysis
          path: |
            report/
            datax-analysis/
            extracted/
          if-no-files-found: warn
          retention-days: 30
