name: Analyze Canon EOS Utility 2.14.31.12c

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze EOS Utility 2.14.31.12c
    runs-on: macos-26

    env:
      DOWNLOAD_URL: "https://drive.usercontent.google.com/download?id=1fWSpcQ1-StjwzxlQG2eKNTIfC8qJmqh-&export=download&confirm=t&uuid=7fa31e8a-c5b0-4e35-a6fc-13df3fb37131"
      ZIP_NAME: "EU-Installset-M2.14.31.12c.dmg.zip"

    steps:

      # ============================================================
      # SYSTEM
      # ============================================================

      - name: System information
        run: |
          set -u

          echo "======================================"
          echo "SYSTEM"
          echo "======================================"

          uname -a || true
          echo

          echo "Architecture:"
          uname -m || true

          echo
          echo "Machine:"
          sysctl -n hw.machine 2>/dev/null || true

          echo
          echo "macOS:"
          sw_vers || true

          echo
          echo "Xcode:"
          xcodebuild -version 2>/dev/null || true

      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: Create workspace
        run: |
          set -u

          mkdir -p "$GITHUB_WORKSPACE/work"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/report"
          mkdir -p "$GITHUB_WORKSPACE/datax-analysis"
          mkdir -p "$GITHUB_WORKSPACE/payload"

      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: Download EOS Utility ZIP
        working-directory: work
        run: |
          set -u

          echo "Downloading EOS Utility..."

          rm -f "$ZIP_NAME"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            -o "$ZIP_NAME" \
            "$DOWNLOAD_URL"

          echo
          echo "Downloaded:"
          ls -lh "$ZIP_NAME"

          echo
          echo "File type:"
          file "$ZIP_NAME" || true

          echo
          echo "SHA256:"
          shasum -a 256 "$ZIP_NAME" \
            | tee "$GITHUB_WORKSPACE/report/archive.sha256"

      # ============================================================
      # ZIP TEST
      # ============================================================

      - name: Validate ZIP
        working-directory: work
        run: |
          set -u

          if unzip -t "$ZIP_NAME" \
            > "$GITHUB_WORKSPACE/report/zip-test.txt" 2>&1
          then
            echo "ZIP OK"
          else
            echo "ZIP TEST FAILED"
            cat "$GITHUB_WORKSPACE/report/zip-test.txt"
            exit 1
          fi

      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP
        working-directory: extracted
        run: |
          set -u

          rm -rf ./*

          unzip -o \
            "$GITHUB_WORKSPACE/work/$ZIP_NAME"

          echo "Extracted files:"

          find . \
            -print \
            2>/dev/null \
            | sort \
            > "$GITHUB_WORKSPACE/report/extracted-files.txt"

          cat "$GITHUB_WORKSPACE/report/extracted-files.txt"

      # ============================================================
      # FIND DMG
      # ============================================================

      - name: Locate DMG
        id: dmg
        run: |
          set -u

          DMG=""

          while IFS= read -r F; do
            DMG="$F"
            break
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -iname '*.dmg' \
              -print \
              2>/dev/null
          )

          if [ -z "$DMG" ]; then
            echo "ERROR: DMG not found."
            exit 1
          fi

          echo "DMG=$DMG" >> "$GITHUB_OUTPUT"

          echo "DMG:"
          echo "$DMG"

          echo
          file "$DMG" || true

          echo
          shasum -a 256 "$DMG" \
            | tee "$GITHUB_WORKSPACE/report/dmg.sha256"

      # ============================================================
      # DMG INFO
      # ============================================================

      - name: Analyze DMG
        env:
          DMG: ${{ steps.dmg.outputs.DMG }}
        run: |
          set -u

          hdiutil imageinfo "$DMG" \
            > "$GITHUB_WORKSPACE/report/dmg-imageinfo.txt" \
            2>&1 || true

          cat "$GITHUB_WORKSPACE/report/dmg-imageinfo.txt"

      # ============================================================
      # MOUNT
      # ============================================================

      - name: Mount DMG
        id: mount
        env:
          DMG: ${{ steps.dmg.outputs.DMG }}
        run: |
          set -u

          MOUNT_POINT="$RUNNER_TEMP/eos-dmg"

          mkdir -p "$MOUNT_POINT"

          echo "Mounting..."

          if ! hdiutil attach \
            "$DMG" \
            -mountpoint "$MOUNT_POINT" \
            -nobrowse \
            -noautoopen
          then
            echo "ERROR: Cannot mount DMG."
            exit 1
          fi

          echo "MOUNT_POINT=$MOUNT_POINT" >> "$GITHUB_OUTPUT"

          echo
          echo "Mounted:"
          echo "$MOUNT_POINT"

      # ============================================================
      # SAFE DMG LIST
      # ============================================================

      - name: List DMG contents
        env:
          MOUNT_POINT: ${{ steps.mount.outputs.MOUNT_POINT }}
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report/dmg-contents.txt"

          echo "======================================"
          echo "DMG CONTENTS"
          echo "======================================"

          find "$MOUNT_POINT" \
            -path "$MOUNT_POINT/.Trashes" -prune \
            -o -path "$MOUNT_POINT/.fseventsd" -prune \
            -o -path "$MOUNT_POINT/.TemporaryItems" -prune \
            -o -print \
            2>/dev/null \
            | sort \
            > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # FIND INSTALLER
      # ============================================================

      - name: Locate installer
        id: installer
        env:
          MOUNT_POINT: ${{ steps.mount.outputs.MOUNT_POINT }}
        run: |
          set -u

          INSTALLER=""

          while IFS= read -r F; do
            INSTALLER="$F"
            break
          done < <(
            find "$MOUNT_POINT" \
              -type d \
              -name '*.app' \
              -print \
              2>/dev/null
          )

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: Installer .app not found."
            exit 1
          fi

          echo "INSTALLER=$INSTALLER" >> "$GITHUB_OUTPUT"

          echo
          echo "Installer:"
          echo "$INSTALLER"

      # ============================================================
      # INSTALLER STRUCTURE
      # ============================================================

      - name: Analyze installer structure
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          find "$INSTALLER" \
            -print \
            2>/dev/null \
            | sort \
            > "$GITHUB_WORKSPACE/report/installer-structure.txt"

          cat "$GITHUB_WORKSPACE/report/installer-structure.txt"

      # ============================================================
      # INFO PLIST
      # ============================================================

      - name: Analyze Info.plist
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          PLIST="$INSTALLER/Contents/Info.plist"
          REPORT="$GITHUB_WORKSPACE/report/installer-info.txt"

          if [ -f "$PLIST" ]; then

            /usr/libexec/PlistBuddy \
              -c "Print" \
              "$PLIST" \
              > "$REPORT" \
              2>&1 || true

            cat "$REPORT"

          else

            echo "Info.plist not found."

          fi

      # ============================================================
      # OFICORE
      # ============================================================

      - name: Analyze OFICore
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          OFICORE="$INSTALLER/Contents/MacOS/OFICore"
          REPORT="$GITHUB_WORKSPACE/report"

          if [ ! -f "$OFICORE" ]; then
            echo "OFICore not found."
            exit 0
          fi

          echo "======================================"
          echo "OFICORE"
          echo "======================================"

          file "$OFICORE" \
            | tee "$REPORT/oficore-file.txt"

          echo
          echo "Architecture:"

          lipo -info "$OFICORE" \
            2>&1 \
            | tee "$REPORT/oficore-architecture.txt" \
            || true

          echo
          echo "Mach-O header:"

          otool -hv "$OFICORE" \
            2>&1 \
            | tee "$REPORT/oficore-header.txt" \
            || true

          echo
          echo "Libraries:"

          otool -L "$OFICORE" \
            2>&1 \
            | tee "$REPORT/oficore-libraries.txt" \
            || true

          echo
          echo "Canon strings:"

          strings -a "$OFICORE" \
            2>/dev/null \
            | grep -Ei \
              'canon|eos|edsdk|camera|utility|installer|package|framework|dylib' \
            | sort -u \
            > "$REPORT/oficore-canon-strings.txt" \
            || true

          cat "$REPORT/oficore-canon-strings.txt" || true

      # ============================================================
      # DATAX
      # ============================================================

      - name: Analyze Data.datx
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          DATAX="$INSTALLER/Contents/Resources/Data.datx"
          OUT="$GITHUB_WORKSPACE/datax-analysis"

          mkdir -p "$OUT"

          if [ ! -f "$DATAX" ]; then
            echo "Data.datx not found."
            exit 0
          fi

          echo "======================================"
          echo "DATA.DATX"
          echo "======================================"

          ls -lh "$DATAX"

          file "$DATAX" \
            | tee "$OUT/file.txt"

          shasum -a 256 "$DATAX" \
            | tee "$OUT/sha256.txt"

          xxd -l 512 "$DATAX" \
            > "$OUT/header.txt" \
            2>&1 || true

          strings -a "$DATAX" \
            > "$OUT/all-strings.txt" \
            2>/dev/null || true

          grep -Ei \
            'canon|eos|edsdk|camera|utility|framework|dylib|pkg|\.app|\.framework' \
            "$OUT/all-strings.txt" \
            | sort -u \
            > "$OUT/relevant-strings.txt" \
            || true

          echo
          echo "Relevant Data.datx strings:"
          cat "$OUT/relevant-strings.txt" || true

      # ============================================================
      # FIND ALL PAYLOADS
      # ============================================================

      - name: Find payload files
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report/payload-files.txt"

          find "$INSTALLER" \
            -type f \
            \( \
              -iname '*.pkg' \
              -o -iname '*.mpkg' \
              -o -iname '*.dmg' \
              -o -iname '*.zip' \
              -o -iname '*.xar' \
              -o -iname '*.tar' \
              -o -iname '*.gz' \
              -o -iname '*.bz2' \
              -o -iname '*.dat' \
              -o -iname '*.datx' \
              -o -iname '*.bin' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            > "$REPORT"

          echo "Payload candidates:"
          cat "$REPORT" || true

          # IMPORTANT:
          # Do NOT fail when no PKG exists.

      # ============================================================
      # PKG ANALYSIS - FIXED
      # ============================================================

      - name: Analyze PKG packages
        env:
          MOUNT_POINT: ${{ steps.mount.outputs.MOUNT_POINT }}
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set +e

          REPORT="$GITHUB_WORKSPACE/report"

          echo "======================================"
          echo "PKG ANALYSIS"
          echo "======================================"

          : > "$REPORT/install-packages.txt"
          : > "$REPORT/pkg-analysis.txt"

          find "$MOUNT_POINT" \
            -type f \
            \( \
              -name '*.pkg' \
              -o -name '*.mpkg' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            > "$REPORT/install-packages.txt"

          if [ ! -s "$REPORT/install-packages.txt" ]; then

            echo "No .pkg/.mpkg files found in DMG."

            echo "No .pkg/.mpkg files found." \
              > "$REPORT/pkg-analysis.txt"

            exit 0

          fi

          echo "Packages found:"

          cat "$REPORT/install-packages.txt"

          while IFS= read -r PKG; do

            [ -z "$PKG" ] && continue

            echo "==================================================" \
              >> "$REPORT/pkg-analysis.txt"

            echo "$PKG" \
              >> "$REPORT/pkg-analysis.txt"

            pkgutil \
              --check-signature "$PKG" \
              >> "$REPORT/pkg-analysis.txt" \
              2>&1

          done < "$REPORT/install-packages.txt"

          exit 0

      # ============================================================
      # SEARCH ALL MACH-O
      # ============================================================

      - name: Find Mach-O binaries
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"
          MACHO="$REPORT/all-mach-o.txt"

          : > "$MACHO"

          while IFS= read -r FILE; do

            TYPE="$(file -b "$FILE" 2>/dev/null || true)"

            case "$TYPE" in

              *"Mach-O"*)
                echo "$FILE" >> "$MACHO"
                ;;

            esac

          done < <(
            find "$INSTALLER" \
              -type f \
              -print \
              2>/dev/null
          )

          sort -u "$MACHO" -o "$MACHO"

          echo "======================================"
          echo "MACH-O FILES"
          echo "======================================"

          cat "$MACHO" || true

      # ============================================================
      # ARCHITECTURES
      # ============================================================

      - name: Analyze architectures
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/all-macho-architectures.txt"

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            {
              echo "=================================================="
              echo "$FILE"
              echo "--------------------------------------------------"

              file "$FILE" 2>&1 || true

              echo

              lipo -info "$FILE" 2>&1 || true

              echo

              otool -hv "$FILE" 2>&1 | head -40 || true

            } >> "$REPORT/all-macho-architectures.txt"

          done < "$REPORT/all-mach-o.txt"

          cat "$REPORT/all-macho-architectures.txt"

      # ============================================================
      # LIBRARIES
      # ============================================================

      - name: Analyze linked libraries
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/linked-libraries.txt"

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            {
              echo "=================================================="
              echo "$FILE"
              echo "--------------------------------------------------"

              otool -L "$FILE" 2>&1 || true

            } >> "$REPORT/linked-libraries.txt"

          done < "$REPORT/all-mach-o.txt"

          cat "$REPORT/linked-libraries.txt"

      # ============================================================
      # CANON / EOS / EDSDK STRINGS
      # ============================================================

      - name: Analyze Canon strings
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          : > "$REPORT/canon-strings.txt"

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            {
              echo "=================================================="
              echo "$FILE"
              echo "--------------------------------------------------"

              strings -a "$FILE" 2>/dev/null \
                | grep -Ei \
                  'canon|eos|edsdk|camera|remote.?shoot|live.?view|cr2|download|capture|shutter' \
                | sort -u \
                || true

            } >> "$REPORT/canon-strings.txt"

          done < "$REPORT/all-mach-o.txt"

          cat "$REPORT/canon-strings.txt" || true

      # ============================================================
      # CODESIGN
      # ============================================================

      - name: Analyze code signing
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          codesign \
            -dv \
            --verbose=4 \
            "$INSTALLER" \
            > "$REPORT/codesign.txt" \
            2>&1 || true

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$INSTALLER" \
            > "$REPORT/codesign-verify.txt" \
            2>&1 || true

          codesign \
            -d \
            --entitlements :- \
            "$INSTALLER" \
            > "$REPORT/entitlements.plist" \
            2>&1 || true

      # ============================================================
      # SEARCH INSTALLER FOR EDSDK
      # ============================================================

      - name: Search EDSDK references
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"

          echo "======================================"
          echo "EDSDK SEARCH"
          echo "======================================"

          grep -Rai \
            -E \
            'EDSDK|EDSDK.framework|EdsInitializeSDK|EdsGetCameraList|EdsOpenSession|EdsDownload' \
            "$INSTALLER" \
            > "$REPORT/edsdk-search.txt" \
            2>/dev/null \
            || true

          cat "$REPORT/edsdk-search.txt" || true

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Generate summary
        if: always()
        env:
          INSTALLER: ${{ steps.installer.outputs.INSTALLER }}
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/report"
          SUMMARY="$REPORT/SUMMARY.md"

          {
            echo "# EOS Utility 2.14.31.12c Analysis"
            echo

            echo "## Environment"
            echo

            echo "- Runner: macOS 26"
            echo "- Runner architecture: $(uname -m 2>/dev/null || echo unknown)"
            echo "- macOS: $(sw_vers -productVersion 2>/dev/null || echo unknown)"
            echo

            echo "## DMG"
            echo

            cat "$REPORT/dmg.sha256" 2>/dev/null || true

            echo

            echo "## Installer"
            echo

            echo "\`$INSTALLER\`"

            echo

            echo "## OFICore architecture"
            echo

            echo '```text'
            cat "$REPORT/oficore-architecture.txt" 2>/dev/null || true
            echo '```'

            echo

            echo "## All Mach-O architectures"
            echo

            echo '```text'
            cat "$REPORT/all-macho-architectures.txt" 2>/dev/null || true
            echo '```'

            echo

            echo "## Linked libraries"
            echo

            echo '```text'
            cat "$REPORT/linked-libraries.txt" 2>/dev/null || true
            echo '```'

            echo

            echo "## EDSDK search"
            echo

            echo '```text'
            cat "$REPORT/edsdk-search.txt" 2>/dev/null || true
            echo '```'

            echo

            echo "## Canon strings"
            echo

            echo '```text'
            cat "$REPORT/canon-strings.txt" 2>/dev/null || true
            echo '```'

            echo

            echo "## PKG"
            echo

            cat "$REPORT/pkg-analysis.txt" 2>/dev/null || true

            echo

            echo "## Conclusion"
            echo

            echo "Architecture must be determined from all-macho-architectures.txt."
            echo "arm64 = Apple Silicon native."
            echo "x86_64 = Intel."
            echo "arm64 + x86_64 = Universal."

          } > "$SUMMARY"

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # DETACH
      # ============================================================

      - name: Detach DMG
        if: always()
        env:
          MOUNT_POINT: ${{ steps.mount.outputs.MOUNT_POINT }}
        run: |
          set +e

          if [ -n "${MOUNT_POINT:-}" ]; then

            if mount | grep -F "$MOUNT_POINT" >/dev/null 2>&1; then

              hdiutil detach \
                "$MOUNT_POINT" \
                -force \
                2>&1 || true

            fi

          fi

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EOS-Utility-2.14.31.12c-analysis
          path: |
            report/
            datax-analysis/
          if-no-files-found: warn
          retention-days: 30
